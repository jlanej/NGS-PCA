name: Integration Test

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  highcov-setup-manifest:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download real IGSR NYGC 30x sequence indexes
        working-directory: example/1000G_highcov
        run: |
          set -euo pipefail
          TEST_WORK="${RUNNER_TEMP}/highcov_setup_test"
          mkdir -p "${TEST_WORK}/reference"
          # Empty placeholders — this test targets only manifest generation (step 4/5)
          touch "${TEST_WORK}/ngs-pca.sif" "${TEST_WORK}/reference/ref.fa" "${TEST_WORK}/igsr_sample_panel.ped"

          # Download the real NYGC 30x sequence indexes from EBI FTP
          echo "Downloading 2504-sample sequence index..."
          curl -sSL -o "${TEST_WORK}/1000G_2504_high_coverage.sequence.index" \
            "ftp://ftp.1000genomes.ebi.ac.uk/vol1/ftp/data_collections/1000G_2504_high_coverage/1000G_2504_high_coverage.sequence.index"
          echo "Downloading 698-sample sequence index..."
          curl -sSL -o "${TEST_WORK}/1000G_698_related_high_coverage.sequence.index" \
            "ftp://ftp.1000genomes.ebi.ac.uk/vol1/ftp/data_collections/1000G_2504_high_coverage/1000G_698_related_high_coverage.sequence.index"

          # Run 00_setup.sh with real indexes
          WORK_DIR="${TEST_WORK}" \
          SIF_IMAGE="${TEST_WORK}/ngs-pca.sif" \
          REF_DIR="${TEST_WORK}/reference" \
          REF_FASTA="${TEST_WORK}/reference/ref.fa" \
          INDEX_FILE_2504="${TEST_WORK}/1000G_2504_high_coverage.sequence.index" \
          INDEX_FILE_698="${TEST_WORK}/1000G_698_related_high_coverage.sequence.index" \
          MANIFEST="${TEST_WORK}/manifest.tsv" \
          PANEL_FILE="${TEST_WORK}/igsr_sample_panel.ped" \
          MIN_MANIFEST_SAMPLES=3000 \
          EXPECTED_MANIFEST_SAMPLES=3202 \
          bash 00_setup.sh

          SAMPLE_COUNT=$(tail -n +2 "${TEST_WORK}/manifest.tsv" | wc -l)
          echo "Manifest sample count: ${SAMPLE_COUNT}"
          if (( SAMPLE_COUNT < 3000 )); then
            echo "::error::Manifest has only ${SAMPLE_COUNT} samples (minimum expected: 3000)."
            exit 1
          fi
          echo "Manifest validation passed (${SAMPLE_COUNT} samples)."

  mosdepth-coverage-summary-test:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Test mosdepth coverage summary parsing
        working-directory: example/1000G_highcov
        run: |
          set -euo pipefail
          TEST_WORK="${RUNNER_TEMP}/cov_summary_test"
          mkdir -p "${TEST_WORK}/mosdepth_output" "${TEST_WORK}/qc_output"

          # ── Create synthetic mosdepth regions.bed.gz files ──
          # Each file has autosomal bins with known coverage values
          echo "=== Creating synthetic mosdepth regions data ==="

          # Sample A: coverage values 10,20,30,40,50 (mean=30, median=30, sd=15.81, IQR=20)
          {
            printf "chr1\t0\t1000\t10\n"
            printf "chr1\t1000\t2000\t20\n"
            printf "chr2\t0\t1000\t30\n"
            printf "chr2\t1000\t2000\t40\n"
            printf "chr3\t0\t1000\t50\n"
            printf "chrX\t0\t1000\t15\n"
          } | gzip > "${TEST_WORK}/mosdepth_output/sampleA.by1000.regions.bed.gz"

          # Sample B: uniform coverage of 25 across 4 bins
          {
            printf "chr1\t0\t1000\t25\n"
            printf "chr1\t1000\t2000\t25\n"
            printf "chr2\t0\t1000\t25\n"
            printf "chr2\t1000\t2000\t25\n"
          } | gzip > "${TEST_WORK}/mosdepth_output/sampleB.by1000.regions.bed.gz"

          # ── Run the coverage summary script ──
          echo "=== Running 03a_mosdepth_coverage_summary.sh ==="
          WORK_DIR="${TEST_WORK}" \
          MOSDEPTH_DIR="${TEST_WORK}/mosdepth_output" \
          QC_OUTPUT="${TEST_WORK}/qc_output" \
          bash 03a_mosdepth_coverage_summary.sh

          # ── Validate output ──
          OUT="${TEST_WORK}/qc_output/mosdepth_coverage_summary.tsv"
          if [[ ! -f "${OUT}" ]]; then
            echo "::error::Coverage summary output not found"
            exit 1
          fi

          echo "=== Validating coverage summary output ==="
          cat "${OUT}"

          # Check header
          HEADER=$(head -1 "${OUT}")
          EXPECTED_HEADER="SAMPLE_ID	MEAN_COV	MEDIAN_COV	SD_COV	MAD_COV	IQR_COV	HQ_MEAN_COV	HQ_MEDIAN_COV	HQ_SD_COV	HQ_MAD_COV	HQ_IQR_COV"
          if [[ "${HEADER}" != "${EXPECTED_HEADER}" ]]; then
            echo "::error::Header mismatch. Got: ${HEADER}"
            exit 1
          fi
          echo "PASS: Header matches expected format"

          # Check we got 2 samples
          NROWS=$(tail -n +2 "${OUT}" | wc -l)
          if (( NROWS != 2 )); then
            echo "::error::Expected 2 sample rows, got ${NROWS}"
            exit 1
          fi
          echo "PASS: Got ${NROWS} sample rows"

          # Validate sampleA values (5 autosomal bins: 10,20,30,40,50; chrX bin excluded)
          # Expected: mean=30, median=30, sd=15.8114 (sample SD), mad=10, iqr=20
          #   Q1 at position floor(n/4)+1=2 → 20, Q3 at position floor(3n/4)+1=4 → 40, IQR=20
          #   MAD = median of |10-30|=20,|20-30|=10,|30-30|=0,|40-30|=10,|50-30|=20 → sorted
          #         [0,10,10,20,20], median at pos 3 = 10
          SAMPLE_A=$(awk -F'\t' '$1 == "sampleA"' "${OUT}")
          if [[ -z "${SAMPLE_A}" ]]; then
            echo "::error::sampleA not found in output"
            exit 1
          fi
          MEAN_A=$(echo "${SAMPLE_A}" | cut -f2)
          MEDIAN_A=$(echo "${SAMPLE_A}" | cut -f3)
          SD_A=$(echo "${SAMPLE_A}" | cut -f4)
          MAD_A=$(echo "${SAMPLE_A}" | cut -f5)
          IQR_A=$(echo "${SAMPLE_A}" | cut -f6)
          echo "  sampleA: mean=${MEAN_A}, median=${MEDIAN_A}, sd=${SD_A}, mad=${MAD_A}, iqr=${IQR_A}"

          # Mean should be 30.0000 (chrX bin with 15.0 must be excluded — autosomal only)
          # If chrX were included: mean=(10+20+30+40+50+15)/6=27.5 ≠ 30
          if [[ "${MEAN_A}" != "30.0000" ]]; then
            echo "::error::sampleA mean expected 30.0000, got ${MEAN_A} (chrX bin may not be excluded)"
            exit 1
          fi
          echo "PASS: sampleA mean correct (chrX excluded)"

          # Median should be 30.0000
          if [[ "${MEDIAN_A}" != "30.0000" ]]; then
            echo "::error::sampleA median expected 30.0000, got ${MEDIAN_A}"
            exit 1
          fi
          echo "PASS: sampleA median correct"

          # SD should be 15.8114 (sample SD, divides by n-1=4)
          # sqrt(((10-30)^2+(20-30)^2+(30-30)^2+(40-30)^2+(50-30)^2)/4) = sqrt(250) = 15.8114
          if [[ "${SD_A}" != "15.8114" ]]; then
            echo "::error::sampleA SD expected 15.8114 (sample SD), got ${SD_A}"
            exit 1
          fi
          echo "PASS: sampleA SD correct (sample standard deviation)"

          # MAD should be 10.0000
          if [[ "${MAD_A}" != "10.0000" ]]; then
            echo "::error::sampleA MAD expected 10.0000, got ${MAD_A}"
            exit 1
          fi
          echo "PASS: sampleA MAD correct"

          # IQR should be 20.0000 (Q3=40 at pos 4, Q1=20 at pos 2; IQR=40-20=20)
          if [[ "${IQR_A}" != "20.0000" ]]; then
            echo "::error::sampleA IQR expected 20.0000, got ${IQR_A}"
            exit 1
          fi
          echo "PASS: sampleA IQR correct"

          # Validate sampleB values (4 bins all 25: mean=25, median=25, sd=0, mad=0, iqr=0)
          SAMPLE_B=$(awk -F'\t' '$1 == "sampleB"' "${OUT}")
          MEAN_B=$(echo "${SAMPLE_B}" | cut -f2)
          MEDIAN_B=$(echo "${SAMPLE_B}" | cut -f3)
          SD_B=$(echo "${SAMPLE_B}" | cut -f4)
          MAD_B=$(echo "${SAMPLE_B}" | cut -f5)
          IQR_B=$(echo "${SAMPLE_B}" | cut -f6)
          echo "  sampleB: mean=${MEAN_B}, median=${MEDIAN_B}, sd=${SD_B}, mad=${MAD_B}, iqr=${IQR_B}"
          if [[ "${MEAN_B}" != "25.0000" ]]; then
            echo "::error::sampleB mean expected 25.0000, got ${MEAN_B}"
            exit 1
          fi
          if [[ "${MEDIAN_B}" != "25.0000" ]]; then
            echo "::error::sampleB median expected 25.0000, got ${MEDIAN_B}"
            exit 1
          fi
          if [[ "${SD_B}" != "0.0000" ]]; then
            echo "::error::sampleB SD expected 0.0000, got ${SD_B}"
            exit 1
          fi
          if [[ "${MAD_B}" != "0.0000" ]]; then
            echo "::error::sampleB MAD expected 0.0000, got ${MAD_B}"
            exit 1
          fi
          if [[ "${IQR_B}" != "0.0000" ]]; then
            echo "::error::sampleB IQR expected 0.0000, got ${IQR_B}"
            exit 1
          fi
          echo "PASS: sampleB values correct (uniform coverage: SD=MAD=IQR=0)"

          echo ""
          echo "=== All mosdepth coverage summary tests passed ==="

      - name: Test QC table integration with coverage summary
        working-directory: example/1000G_highcov
        run: |
          set -euo pipefail
          TEST_WORK="${RUNNER_TEMP}/qc_integration_test"
          mkdir -p "${TEST_WORK}/mosdepth_output" "${TEST_WORK}/qc_output"

          # ── Create synthetic mosdepth summary and dist files ──
          printf "chrom\tlength\tbases\tmean\tmin\tmax\n" > "${TEST_WORK}/mosdepth_output/testSample.by1000.mosdepth.summary.txt"
          printf "chr1\t248956422\t7468692660\t30.00\t0\t100\n" >> "${TEST_WORK}/mosdepth_output/testSample.by1000.mosdepth.summary.txt"
          printf "chr2\t242193529\t7265805870\t30.00\t0\t100\n" >> "${TEST_WORK}/mosdepth_output/testSample.by1000.mosdepth.summary.txt"
          printf "chrX\t156040895\t4681226850\t15.00\t0\t100\n" >> "${TEST_WORK}/mosdepth_output/testSample.by1000.mosdepth.summary.txt"
          printf "chrY\t57227415\t286137075\t5.00\t0\t100\n" >> "${TEST_WORK}/mosdepth_output/testSample.by1000.mosdepth.summary.txt"
          printf "chrM\t16569\t828450\t50.00\t0\t100\n" >> "${TEST_WORK}/mosdepth_output/testSample.by1000.mosdepth.summary.txt"

          printf "total\t0\t1.0000\n" > "${TEST_WORK}/mosdepth_output/testSample.by1000.mosdepth.global.dist.txt"
          printf "total\t10\t0.9500\n" >> "${TEST_WORK}/mosdepth_output/testSample.by1000.mosdepth.global.dist.txt"
          printf "total\t20\t0.9000\n" >> "${TEST_WORK}/mosdepth_output/testSample.by1000.mosdepth.global.dist.txt"
          printf "total\t30\t0.5100\n" >> "${TEST_WORK}/mosdepth_output/testSample.by1000.mosdepth.global.dist.txt"
          printf "total\t31\t0.4900\n" >> "${TEST_WORK}/mosdepth_output/testSample.by1000.mosdepth.global.dist.txt"

          # ── Create synthetic coverage summary ──
          printf "SAMPLE_ID\tMEAN_COV\tMEDIAN_COV\tSD_COV\tMAD_COV\tIQR_COV\tHQ_MEAN_COV\tHQ_MEDIAN_COV\tHQ_SD_COV\tHQ_MAD_COV\tHQ_IQR_COV\n" > "${TEST_WORK}/qc_output/mosdepth_coverage_summary.tsv"
          printf "testSample\t30.0000\t30.0000\t5.1234\t3.4567\t7.8901\t29.0000\t29.0000\t4.5678\t2.3456\t6.7890\n" >> "${TEST_WORK}/qc_output/mosdepth_coverage_summary.tsv"

          # ── Run 03_collect_qc.sh ──
          echo "=== Running 03_collect_qc.sh ==="
          WORK_DIR="${TEST_WORK}" \
          MOSDEPTH_DIR="${TEST_WORK}/mosdepth_output" \
          QC_OUTPUT="${TEST_WORK}/qc_output" \
          PANEL_FILE="${TEST_WORK}/nonexistent_panel.ped" \
          MANIFEST="${TEST_WORK}/nonexistent_manifest.tsv" \
          bash 03_collect_qc.sh

          # ── Validate output ──
          OUT="${TEST_WORK}/qc_output/sample_qc.tsv"
          if [[ ! -f "${OUT}" ]]; then
            echo "::error::QC table output not found"
            exit 1
          fi

          echo "=== QC table output ==="
          cat "${OUT}"

          # ── Verify column structure ───────────────────────────────────────────
          HEADER=$(head -1 "${OUT}")

          # Verify all expected coverage/QC columns are present
          for col in MEAN_AUTOSOMAL_COV X_COV_RATIO Y_COV_RATIO INFERRED_SEX MITO_COV_RATIO \
                     MEDIAN_GENOME_COV PCT_GENOME_COV_10X PCT_GENOME_COV_20X \
                     SD_COV MAD_COV IQR_COV MEDIAN_BIN_COV \
                     HQ_MEDIAN_COV HQ_SD_COV HQ_MAD_COV HQ_IQR_COV MTDNA_CN; do
            if ! echo "${HEADER}" | grep -qw "${col}"; then
              echo "::error::Missing column ${col} in header"
              exit 1
            fi
          done
          echo "PASS: All expected QC columns present in header"

          # Verify the 18-column header order (before panel/manifest joins)
          # Columns must appear in this exact order: mosdepth summary → dist → cov variability → HQ+MTDNA_CN
          EXPECTED_HEADER=$(printf '%s\t' \
            SAMPLE_ID MEAN_AUTOSOMAL_COV X_COV_RATIO Y_COV_RATIO INFERRED_SEX MITO_COV_RATIO \
            MEDIAN_GENOME_COV PCT_GENOME_COV_10X PCT_GENOME_COV_20X \
            SD_COV MAD_COV IQR_COV MEDIAN_BIN_COV \
            HQ_MEDIAN_COV HQ_SD_COV HQ_MAD_COV HQ_IQR_COV MTDNA_CN \
            | sed 's/\t$//')
          if [[ "${HEADER}" != "${EXPECTED_HEADER}" ]]; then
            echo "::error::QC table header order mismatch."
            echo "  Expected: $(echo "${EXPECTED_HEADER}" | tr '\t' '|')"
            echo "  Got:      $(echo "${HEADER}" | tr '\t' '|')"
            exit 1
          fi
          echo "PASS: QC table header order correct (18 columns)"

          # Verify no BAS columns remain
          for col in TOTAL_BASES MAPPED_BASES DUPLICATE_READS PCT_DUPLICATE; do
            if echo "${HEADER}" | grep -q "${col}"; then
              echo "::error::BAS column ${col} still present in header"
              exit 1
            fi
          done
          echo "PASS: No BAS columns in header"

          # ── Verify computed metric values ─────────────────────────────────────
          # Column assignments (1-based):
          #  1=SAMPLE_ID  2=MEAN_AUTOSOMAL_COV  3=X_COV_RATIO  4=Y_COV_RATIO
          #  5=INFERRED_SEX  6=MITO_COV_RATIO  7=MEDIAN_GENOME_COV
          #  8=PCT_GENOME_COV_10X  9=PCT_GENOME_COV_20X
          # 10=SD_COV  11=MAD_COV  12=IQR_COV  13=MEDIAN_BIN_COV
          # 14=HQ_MEDIAN_COV  15=HQ_SD_COV  16=HQ_MAD_COV  17=HQ_IQR_COV
          # 18=MTDNA_CN
          DATA=$(awk -F'\t' 'NR==2' "${OUT}")

          check_field() {
            local field_name="$1" col_num="$2" expected="$3"
            local actual
            actual=$(echo "${DATA}" | cut -f"${col_num}")
            if [[ "${actual}" != "${expected}" ]]; then
              echo "::error::${field_name} (col ${col_num}): expected '${expected}', got '${actual}'"
              exit 1
            fi
            echo "PASS: ${field_name} = ${actual}"
          }

          # MEAN_AUTOSOMAL_COV: chr1(30×) and chr2(30×), length-weighted avg = 30.0000
          # chrX/Y/M are excluded from autosomal mean
          check_field "MEAN_AUTOSOMAL_COV" 2 "30.0000"

          # X_COV_RATIO: chrX_mean(15.00) / auto_mean(30.00) = 0.5000
          check_field "X_COV_RATIO" 3 "0.5000"

          # Y_COV_RATIO: chrY_mean(5.00) / auto_mean(30.00) = 0.1667
          check_field "Y_COV_RATIO" 4 "0.1667"

          # INFERRED_SEX: Y_ratio(0.1667)>0.1 AND X_ratio(0.5000)<0.75 → M
          check_field "INFERRED_SEX" 5 "M"

          # MITO_COV_RATIO: chrM_mean(50.00) / auto_mean(30.00) = 1.6667
          check_field "MITO_COV_RATIO" 6 "1.6667"

          # MEDIAN_GENOME_COV: last depth where cumulative fraction ≥ 0.5
          # From dist: depth=30 has fraction=0.51 ≥ 0.5; depth=31 has 0.49 < 0.5 → median=30
          check_field "MEDIAN_GENOME_COV" 7 "30"

          # PCT_GENOME_COV_10X: fraction at depth=10 (0.9500) × 100 = 95.0000
          check_field "PCT_GENOME_COV_10X" 8 "95.0000"

          # PCT_GENOME_COV_20X: fraction at depth=20 (0.9000) × 100 = 90.0000
          check_field "PCT_GENOME_COV_20X" 9 "90.0000"

          # Coverage variability columns parsed from coverage summary (cols $4,$5,$6,$3 of summary)
          check_field "SD_COV" 10 "5.1234"
          check_field "MAD_COV" 11 "3.4567"
          check_field "IQR_COV" 12 "7.8901"
          # MEDIAN_BIN_COV comes from MEDIAN_COV ($3) of the coverage summary, not SD/MAD/IQR
          check_field "MEDIAN_BIN_COV" 13 "30.0000"

          # HQ coverage columns parsed from coverage summary (cols $8,$9,$10,$11 of summary)
          check_field "HQ_MEDIAN_COV" 14 "29.0000"
          check_field "HQ_SD_COV" 15 "4.5678"
          check_field "HQ_MAD_COV" 16 "2.3456"
          check_field "HQ_IQR_COV" 17 "6.7890"

          # MTDNA_CN: 2 × chrM_mean / HQ_MEDIAN_COV
          #         = 2 × 50.00 / 29.0000 = 3.4483
          # Code path: 2 × MITO_COV_RATIO × MEAN_AUTOSOMAL_COV / HQ_MEDIAN_COV, which expands to the same
          check_field "MTDNA_CN" 18 "3.4483"

          echo ""
          echo "=== All QC table integration tests passed ==="

  integration-test:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build with Maven
        working-directory: ngspca
        run: |
          mvn -B package --file pom.xml
          cp target/ngspca-*.jar target/ngspca.jar

      - name: Run NGS-PCA (UNIFORM distribution)
        working-directory: example
        run: |
          mkdir -p test_output
          java -jar ../ngspca/target/ngspca.jar \
            -input input.files.txt \
            -outputDir test_output/ \
            -numPC 2 \
            -sampleEvery 0 \
            -iters 10 \
            -randomSeed 42 \
            -oversample 2 \
            -distribution UNIFORM \
            -bedExclude ../resources/GRCh38/ngs_pca_exclude.sv_blacklist.map.kmer.50.1.0.dgv.gsd.sorted.merge.bed.gz

      - name: Run NGS-PCA (GAUSSIAN distribution)
        working-directory: example
        run: |
          mkdir -p test_output_gaussian
          java -jar ../ngspca/target/ngspca.jar \
            -input input.files.txt \
            -outputDir test_output_gaussian/ \
            -numPC 2 \
            -sampleEvery 0 \
            -iters 10 \
            -randomSeed 42 \
            -oversample 2 \
            -distribution GAUSSIAN \
            -bedExclude ../resources/GRCh38/ngs_pca_exclude.sv_blacklist.map.kmer.50.1.0.dgv.gsd.sorted.merge.bed.gz

      - name: Generate UNIFORM vs GAUSSIAN distribution comparison
        working-directory: example
        run: |
          python3 compare_distributions.py \
            test_output/ \
            test_output_gaussian/ \
            test_output/distribution_comparison.txt

      - name: Verify the exit-code contract
        working-directory: example
        run: |
          JAR=../ngspca/target/ngspca-0.02-SNAPSHOT.jar

          # asking for usage is not a failure
          java -jar "$JAR" --help > /dev/null 2>&1 \
            || { echo "::error::--help should exit 0"; exit 1; }

          # a run that produces nothing must not report success: a scheduler has nothing else to go on
          if java -jar "$JAR" -input /nonexistent/path -outputDir "${RUNNER_TEMP}/nowhere" > /dev/null 2>&1; then
            echo "::error::a run with no input should exit non-zero"
            exit 1
          fi

          # nor should one that cannot read a mosdepth file partway through. The first file has to be
          # readable, or region selection fails before the loading loop is reached - and the loading
          # loop is the path that used to log the failure, leave the column at zero and exit 0
          ./wideOrientation/generate.sh "${RUNNER_TEMP}/badinput" 3 200
          echo "not gzip" > "${RUNNER_TEMP}/badinput/sample00003.regions.bed.gz"
          if java -jar "$JAR" -input "${RUNNER_TEMP}/badinput" -outputDir "${RUNNER_TEMP}/badout" \
               -numPC 2 -iters 2 -oversample 10 > /dev/null 2>&1; then
            echo "::error::a run that could not read one of its mosdepth files should exit non-zero"
            exit 1
          fi
          echo "Exit-code contract holds."

      - name: Run the --matrix input path
        working-directory: example
        run: |
          # the matrix path has its own reading, sample naming and normalization, and is not
          # exercised anywhere else in CI
          MATRIX="${RUNNER_TEMP}/matrix.txt"
          awk 'BEGIN {
            printf "REGION"
            for (s = 1; s <= 30; s++) printf "\tsample%02d", s
            printf "\n"
            seed = 7
            for (r = 0; r < 200; r++) {
              printf "chr1:%d-%d", r * 1000 + 1, r * 1000 + 1000
              for (s = 1; s <= 30; s++) {
                seed = (seed * 16807) % 2147483647
                v = seed % 4000 + 200
                printf "\t%d.%02d", int(v / 100), v % 100
              }
              printf "\n"
            }
          }' > "$MATRIX"

          java -jar ../ngspca/target/ngspca-0.02-SNAPSHOT.jar \
            -input "$MATRIX" -matrix -normalizeMatrix \
            -outputDir "${RUNNER_TEMP}/matrix_out" \
            -numPC 5 -iters 5 -oversample 20 -randomSeed 42 -threads 4

          for f in svd.pcs.txt svd.loadings.txt svd.singularvalues.txt svd.bins.txt svd.samples.txt; do
            [ -s "${RUNNER_TEMP}/matrix_out/$f" ] \
              || { echo "::error::--matrix run did not write $f"; exit 1; }
          done
          # medians are deliberately not reported for a supplied matrix: NGS-PCA did not choose its rows
          [ ! -f "${RUNNER_TEMP}/matrix_out/autosomal.median.txt" ] \
            || { echo "::error::--matrix run wrote a median table it cannot vouch for"; exit 1; }
          [ "$(wc -l < "${RUNNER_TEMP}/matrix_out/svd.samples.txt")" -eq 30 ] \
            || { echo "::error::--matrix run did not name 30 samples"; exit 1; }
          echo "--matrix path OK."

      - name: Verify output MD5 checksums
        working-directory: example
        run: |
          echo "Comparing output files against expected checksums..."
          FAILED=0
          CHECKED=0

          while IFS='  ' read -r expected_md5 filepath; do
            # Skip empty lines
            [ -z "$expected_md5" ] && continue

            # Check svd.* output files, the per-sample median table, and distribution_comparison.txt
            case "$filepath" in
              ./exampleOutput_1000G_chr1/svd.*|./exampleOutput_1000G_chr1/autosomal.median.txt|./exampleOutput_1000G_chr1/distribution_comparison.txt)
                CHECKED=$((CHECKED + 1))
                filename=$(basename "$filepath")
                test_file="./test_output/$filename"

                if [ ! -f "$test_file" ]; then
                  echo "MISSING: $test_file"
                  FAILED=1
                  continue
                fi

                actual_md5=$(md5sum "$test_file" | awk '{print $1}')
                if [ "$actual_md5" = "$expected_md5" ]; then
                  echo "PASS: $filename ($actual_md5)"
                else
                  echo "FAIL: $filename (expected: $expected_md5, got: $actual_md5)"
                  FAILED=1
                fi
                ;;
            esac
          done < 1000G.chr1.md5

          if [ "$CHECKED" -eq 0 ]; then
            echo "::error::No output files were checked - verify MD5 file and output path patterns"
            exit 1
          fi

          if [ "$FAILED" -ne 0 ]; then
            echo "::error::MD5 checksum verification failed"
            exit 1
          fi

          echo "All $CHECKED output checksums match expected values."

  docker-container-test:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t ngspca:ci-test .

      - name: Verify JAR is accessible at absolute path inside container
        run: |
          docker run --rm --entrypoint java ngspca:ci-test -jar /app/ngspca.jar --help 2>&1 | head -5 || true
          # The real check: ensure the ENTRYPOINT resolves the jar correctly regardless of working directory
          docker run --rm -w /tmp ngspca:ci-test --help 2>&1 | head -5 || true

      - name: Run NGS-PCA via Docker with example data
        working-directory: example
        run: |
          mkdir -p test_output_docker
          docker run --rm \
            -v "$(pwd)/exampleMosdepth_1000G_chr1:/input:ro" \
            -v "$(pwd)/test_output_docker:/output" \
            -v "$(pwd)/../resources:/app/resources:ro" \
            -e JAVA_TOOL_OPTIONS="-Xmx2g" \
            ngspca:ci-test \
            -input /input/ \
            -outputDir /output/ \
            -numPC 2 \
            -sampleEvery 0 \
            -iters 10 \
            -randomSeed 42 \
            -oversample 2 \
            -distribution UNIFORM \
            -bedExclude /app/resources/GRCh38/ngs_pca_exclude.sv_blacklist.map.kmer.50.1.0.dgv.gsd.sorted.merge.bed.gz

      - name: Verify Docker container output matches expected checksums
        working-directory: example
        run: |
          # The container is what actually ships, so it is held to the same reference values as
          # the host build rather than merely to producing files. Note this run takes a directory
          # as input while the host job takes a manifest, so it also covers that path.
          echo "Comparing Docker container output against expected checksums..."
          FAILED=0
          CHECKED=0

          while IFS='  ' read -r expected_md5 filepath; do
            [ -z "$expected_md5" ] && continue

            # distribution_comparison.txt comes from a second, GAUSSIAN run that this job does not
            # perform; the serialized matrices are excluded from checksumming everywhere
            case "$filepath" in
              ./exampleOutput_1000G_chr1/svd.*|./exampleOutput_1000G_chr1/autosomal.median.txt)
                CHECKED=$((CHECKED + 1))
                filename=$(basename "$filepath")
                test_file="./test_output_docker/$filename"

                if [ ! -f "$test_file" ]; then
                  echo "MISSING: $test_file"
                  FAILED=1
                  continue
                fi

                actual_md5=$(md5sum "$test_file" | awk '{print $1}')
                if [ "$actual_md5" = "$expected_md5" ]; then
                  echo "PASS: $filename ($actual_md5)"
                else
                  echo "FAIL: $filename (expected: $expected_md5, got: $actual_md5)"
                  FAILED=1
                fi
                ;;
            esac
          done < 1000G.chr1.md5

          if [ "$CHECKED" -eq 0 ]; then
            echo "::error::No container output files were checked - verify the MD5 file and output path patterns"
            exit 1
          fi

          if [ "$FAILED" -ne 0 ]; then
            echo "::error::Docker container output does not match the expected checksums"
            exit 1
          fi

          echo "Docker container test passed — all $CHECKED output checksums match expected values."

  wide-orientation-test:
    # RandomizedSVD transposes its input when rows < columns and then takes A_t from the matrix
    # as given. The 1000G example has 15,593 bins against 18 samples and so never reaches either,
    # leaving the orientation a selected-bin analysis of a large cohort runs in untested.
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build with Maven
        working-directory: ngspca
        run: mvn -B package --file pom.xml

      - name: Generate the cohort
        working-directory: example/wideOrientation
        run: ./generate.sh "${RUNNER_TEMP}/wide" 2000 1500

      - name: Run NGS-PCA
        working-directory: example/wideOrientation
        run: |
          java -Xmx4g -jar ../../ngspca/target/ngspca-0.02-SNAPSHOT.jar \
            -input "${RUNNER_TEMP}/wide" \
            -outputDir "${RUNNER_TEMP}/wide_output" \
            -numPC 20 \
            -iters 5 \
            -oversample 60 \
            -randomSeed 42 \
            -threads 4 \
            -distribution UNIFORM 2>&1 | tee "${RUNNER_TEMP}/run.log"

          # the point of the fixture: fail loudly if it stopped exercising the branch it exists for
          # asserted because it does not show up in the output: identical checksums would not tell
          # us the transposed orientation was reached at all
          grep -q "Treating the input as transposed" "${RUNNER_TEMP}/run.log" \
            || { echo "::error::input was not treated as transposed - this fixture no longer tests what it is for"; exit 1; }
          # note: that no transpose of the cohort matrix is materialised is NOT checked here. The
          # line that used to be grepped for sat outside every conditional and so always matched -
          # reinstating A.transpose() left the job green. Nothing observable from a shell proves an
          # allocation did not happen; it is held by review and by ParallelMultiplyTest instead.

      - name: Re-run single-threaded and compare
        working-directory: example/wideOrientation
        run: |
          # -threads 1 takes the serial fallback in both ParallelMultiply and ThinQR, so this
          # compares the parallel paths against the serial ones on whatever machine is running.
          # Unlike the checksums below it holds on any platform, and it is the check that covers
          # the parallelism itself rather than the estimator.
          java -Xmx4g -jar ../../ngspca/target/ngspca-0.02-SNAPSHOT.jar \
            -input "${RUNNER_TEMP}/wide" \
            -outputDir "${RUNNER_TEMP}/wide_serial" \
            -numPC 20 -iters 5 -oversample 60 -randomSeed 42 -threads 1 -distribution UNIFORM > /dev/null 2>&1

          FAILED=0
          for f in svd.pcs.txt svd.loadings.txt svd.singularvalues.txt svd.bins.txt svd.samples.txt autosomal.median.txt; do
            if cmp -s "${RUNNER_TEMP}/wide_output/$f" "${RUNNER_TEMP}/wide_serial/$f"; then
              echo "MATCH: $f"
            else
              echo "DIFFERS between 1 and 4 threads: $f"
              FAILED=1
            fi
          done
          if [ "$FAILED" -ne 0 ]; then
            echo "::error::output depends on thread count - dividing the work is changing the values"
            exit 1
          fi
          echo "Thread-independence confirmed."

      - name: Verify output checksums
        working-directory: example/wideOrientation
        run: |
          FAILED=0
          CHECKED=0
          while IFS='  ' read -r expected_md5 filename; do
            [ -z "$expected_md5" ] && continue
            CHECKED=$((CHECKED + 1))
            test_file="${RUNNER_TEMP}/wide_output/$filename"
            if [ ! -f "$test_file" ]; then
              echo "MISSING: $filename"
              FAILED=1
              continue
            fi
            actual_md5=$(md5sum "$test_file" | awk '{print $1}')
            if [ "$actual_md5" = "$expected_md5" ]; then
              echo "PASS: $filename ($actual_md5)"
            else
              echo "FAIL: $filename (expected: $expected_md5, got: $actual_md5)"
              FAILED=1
            fi
          done < expected.md5

          if [ "$CHECKED" -eq 0 ]; then
            echo "::error::No files were checked - verify expected.md5"
            exit 1
          fi
          if [ "$FAILED" -ne 0 ]; then
            echo "::error::Wide-orientation output does not match the expected checksums"
            exit 1
          fi
          echo "Wide-orientation test passed — all $CHECKED output checksums match expected values."

  upstream-parity:
    # Builds PankratzLab/NGS-PCA at the commit this fork diverged from, runs both on the same
    # input, and requires no difference. Nothing is recorded: both sides run on this runner, so
    # the comparison carries no assumption about platform or JVM, which a committed checksum does.
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      UPSTREAM_SHA: 2ffbcfc

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build this branch
        working-directory: ngspca
        run: mvn -B package --file pom.xml -DskipTests

      - name: Build upstream at ${{ env.UPSTREAM_SHA }}
        run: |
          git clone --quiet https://github.com/PankratzLab/NGS-PCA.git "${RUNNER_TEMP}/upstream"
          git -C "${RUNNER_TEMP}/upstream" checkout --quiet "${UPSTREAM_SHA}"
          cd "${RUNNER_TEMP}/upstream/ngspca" && mvn -B package --file pom.xml -DskipTests

      - name: Run both on the same input, in both orientations
        run: |
          set -euo pipefail
          MINE="ngspca/target/ngspca-0.02-SNAPSHOT.jar"
          THEIRS="${RUNNER_TEMP}/upstream/ngspca/target/ngspca-0.02-SNAPSHOT.jar"
          FAILED=0

          # wide is samples > bins, which transposes; tall is the other branch.
          # Keep both shapes large enough that numPC + oversample times a matrix dimension exceeds
          # 4096 entries. Below that MatrixUtils hands back an Array2DRowRealMatrix, commons-math
          # dispatches on the type, and this fork deliberately differs from upstream in the last
          # digits - see RandomizedSVD.transposeProduct. Shrinking these for speed turns an accepted
          # difference into a red build.
          for shape in "wide:300:200" "tall:100:400"; do
            name="${shape%%:*}"; rest="${shape#*:}"; samples="${rest%%:*}"; bins="${rest##*:}"
            work="${RUNNER_TEMP}/parity_${name}"
            ./example/wideOrientation/generate.sh "${work}/mosdepth" "$samples" "$bins"
            ls -1 "${work}/mosdepth"/*.regions.bed.gz | sort > "${work}/manifest.txt"

            # a manifest, not a directory: upstream does not sort its directory listing, so the
            # sample order - and with it the answer - would differ for a reason unrelated to this
            for side in theirs mine; do
              jar="$THEIRS"; [ "$side" = mine ] && jar="$MINE"
              mkdir -p "${work}/${side}"
              # the trailing slash matters: upstream builds output paths by concatenation
              java -Xmx3g -jar "$jar" -input "${work}/manifest.txt" -outputDir "${work}/${side}/" \
                -numPC 10 -iters 5 -oversample 50 -randomSeed 42 -threads 4 > "${work}/${side}.log" 2>&1
            done

            echo "--- ${name}: ${samples} samples x ${bins} bins ---"
            for f in svd.pcs.txt svd.loadings.txt svd.singularvalues.txt svd.bins.txt svd.samples.txt; do
              if cmp -s "${work}/theirs/$f" "${work}/mine/$f"; then
                echo "  IDENTICAL: $f"
              else
                echo "  DIFFERS:   $f"
                FAILED=1
              fi
            done
          done

          # the wide shape must actually have transposed, or it tested the same path twice
          grep -q "Treating the input as transposed" "${RUNNER_TEMP}/parity_wide/mine.log" \
            || { echo "::error::the wide shape did not transpose - both shapes tested one path"; exit 1; }

          if [ "$FAILED" -ne 0 ]; then
            echo "::error::output differs from upstream ${UPSTREAM_SHA} - this fork has changed the estimator"
            exit 1
          fi
          echo "Identical to upstream ${UPSTREAM_SHA} in both orientations."

  fast-mode-eval-test:
    # 04_fast_mode_eval.py summarises the mosdepth fast-mode comparison. The
    # comparison itself needs CRAMs and a cluster; the evaluation is plain
    # arithmetic on two PC tables and a timing directory, so it is held to
    # known answers on synthetic fixtures: a sign-flipped PC must read as
    # perfectly correlated, a perturbed one as slightly less, and paired
    # timings as their designed speedup.
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Syntax-check the pipeline scripts
        working-directory: example/1000G_highcov
        run: |
          set -euo pipefail
          for script in config.sh 01_download_and_mosdepth.sh 01b_mosdepth_sample.sh \
                        01c_dispatch_staged.sh globus_batch_from_manifest.sh \
                        04_fast_mode_eval.sh test_download_manager.sh; do
            bash -n "${script}"
          done
          python3 -m py_compile 04_fast_mode_eval.py
          echo "PASS: scripts parse"

      - name: Build the synthetic fixture
        run: |
          set -euo pipefail
          python3 - <<'EOF'
          import math, os
          S = os.path.join(os.environ["RUNNER_TEMP"], "fastmode_fixture")
          for d in ("normal", "fast", "timing"):
              os.makedirs(os.path.join(S, d), exist_ok=True)
          n, k = 40, 6
          samples = [f"s{i:03d}." for i in range(n)]
          pcs = {s: [math.sin((i + 1) * (pc + 1) * 0.7) for pc in range(k)]
                 for i, s in enumerate(samples)}
          def write(dirname, transform):
              with open(f"{S}/{dirname}/svd.pcs.txt", "w") as out:
                  out.write("SAMPLE\t" + "\t".join(f"PC{p+1}" for p in range(k)) + "\n")
                  for s in samples:
                      out.write(s + "\t" + "\t".join(repr(v) for v in transform(pcs[s])) + "\n")
              with open(f"{S}/{dirname}/svd.singularvalues.txt", "w") as out:
                  out.write("PC\tSINGULAR_VALUES\n")
                  for p in range(k):
                      sv = 100.0 / (p + 1)
                      if dirname == "fast":
                          sv *= 1.01
                      out.write(f"{p+1}\t{sv}\n")
              with open(f"{S}/{dirname}/svd.bins.txt", "w") as out:
                  out.write("\n".join(f"chr1:{b*1000+1}-{(b+1)*1000}" for b in range(50)) + "\n")
          write("normal", lambda v: v)
          def fast(v):
              w = list(v)
              w[1] = -w[1]                                # sign flip: |r| must still be 1
              w[2] = w[2] + 0.01 * math.cos(sum(v))       # perturbation: |r| just under 1
              return w
          write("fast", fast)
          for i, s in enumerate(samples):
              first = "normal" if i % 2 == 0 else "fast"
              for mode, wall in (("normal", 600 + i), ("fast", 300 + i // 2)):
                  with open(f"{S}/timing/{s}.{mode}.tsv", "w") as out:
                      out.write(f"{s}\t{mode}\t{first}\t{wall}\t0.3.14\t2\t1000\thost1\t1700000000\n")
          # QC tables: MTDNA_CN uniformly 5% higher in fast (r stays 1, shift
          # +5.00%), one INFERRED_SEX flipped, POPULATION text must be skipped
          for dirname, mt_scale, hq_scale in (("qc_normal", 1.0, 1.0), ("qc_fast", 1.05, 1.02)):
              os.makedirs(f"{S}/{dirname}", exist_ok=True)
              with open(f"{S}/{dirname}/sample_qc.tsv", "w") as out:
                  out.write("SAMPLE_ID\tMEAN_AUTOSOMAL_COV\tHQ_MEDIAN_COV\tINFERRED_SEX\tMTDNA_CN\tPOPULATION\n")
                  for i, s in enumerate(samples):
                      sex = "M" if i % 2 == 0 else "F"
                      if dirname == "qc_fast" and i == 7:
                          sex = "M"
                      out.write(f"{s}\t{30 + 0.1 * i}\t{(29 + 0.1 * i) * hq_scale}\t{sex}\t"
                                f"{(3 + 0.05 * i) * mt_scale}\tGBR\n")
          print("fixture written to", S)
          EOF

      - name: Run the evaluation without matplotlib and check the answers
        working-directory: example/1000G_highcov
        run: |
          set -euo pipefail
          F="${RUNNER_TEMP}/fastmode_fixture"
          python3 04_fast_mode_eval.py --normal "$F/normal" --fast "$F/fast" \
            --timing "$F/timing" --out "$F/out" --pcs 6 \
            --qc-normal "$F/qc_normal/sample_qc.tsv" --qc-fast "$F/qc_fast/sample_qc.tsv"

          check() { # label actual expected
            if [ "$2" != "$3" ]; then
              echo "::error::$1: expected '$3', got '$2'"; exit 1
            fi
            echo "PASS: $1 = $2"
          }
          COR="$F/out/pc_correlation.tsv"
          check "PC1 |r|"        "$(awk -F'\t' '$1==1 {print $3}' "$COR")" "1.000000"
          check "PC2 signed r"   "$(awk -F'\t' '$1==2 {print $2}' "$COR")" "-1.000000"
          check "PC2 |r|"        "$(awk -F'\t' '$1==2 {print $3}' "$COR")" "1.000000"
          PC3=$(awk -F'\t' '$1==3 {print $3}' "$COR")
          awk -v r="$PC3" 'BEGIN { exit !(r >= 0.999 && r < 1.0) }' \
            || { echo "::error::PC3 |r| should be just under 1, got $PC3"; exit 1; }
          echo "PASS: PC3 |r| = $PC3 (perturbed, just under 1)"

          check "median speedup" "$(awk -F'\t' '$1=="paired_speedup" {print $3}' "$F/out/timing_summary.tsv")" "2.00"
          grep -q "Median per-sample speedup" "$F/out/fast_mode_report.md" \
            || { echo "::error::report is missing the speedup headline"; exit 1; }

          QC="$F/out/qc_concordance.tsv"
          check "MTDNA_CN r"        "$(awk -F'\t' '$1=="MTDNA_CN" {print $3}' "$QC")" "1.000000"
          check "MTDNA_CN shift"    "$(awk -F'\t' '$1=="MTDNA_CN" {print $4}' "$QC")" "5.00"
          check "HQ_MEDIAN_COV shift" "$(awk -F'\t' '$1=="HQ_MEDIAN_COV" {print $4}' "$QC")" "2.00"
          check "MEAN_AUTOSOMAL_COV shift" "$(awk -F'\t' '$1=="MEAN_AUTOSOMAL_COV" {print $4}' "$QC")" "0.00"
          grep -q "POPULATION" "$QC" \
            && { echo "::error::a text column reached the numeric concordance table"; exit 1; }
          grep -q "INFERRED_SEX agreement: 39/40" "$F/out/fast_mode_report.md" \
            || { echo "::error::report is missing the sex-agreement count"; exit 1; }
          echo "PASS: QC concordance - MTDNA_CN shift detected, text columns skipped, sex flip counted"
          [ ! -f "$F/out/fast_mode_summary.png" ] \
            || { echo "::error::a figure appeared without matplotlib"; exit 1; }
          echo "PASS: tables and report written, figure correctly skipped"

          # structural failure must be an error, not a quiet success
          if python3 04_fast_mode_eval.py --normal /nonexistent --fast "$F/fast" \
               --out "$F/out2" > /dev/null 2>&1; then
            echo "::error::a missing input directory should exit non-zero"; exit 1
          fi
          echo "PASS: missing input exits non-zero"

      - name: Run again with matplotlib and check the figure
        working-directory: example/1000G_highcov
        run: |
          set -euo pipefail
          pip install --quiet matplotlib
          F="${RUNNER_TEMP}/fastmode_fixture"
          python3 04_fast_mode_eval.py --normal "$F/normal" --fast "$F/fast" \
            --timing "$F/timing" --out "$F/out_plot" --pcs 6 \
            --qc-normal "$F/qc_normal/sample_qc.tsv" --qc-fast "$F/qc_fast/sample_qc.tsv"
          for figure in fast_mode_summary.png fast_mode_qc.png; do
            [ -s "$F/out_plot/$figure" ] \
              || { echo "::error::$figure was not written with matplotlib installed"; exit 1; }
          done
          echo "PASS: fast_mode_summary.png and fast_mode_qc.png written"

  download-manager-test:
    # The download manager and the mosdepth jobs it spawns, exercised
    # hermetically: sbatch runs 01b inline, squeue reports nothing, apptainer
    # fakes mosdepth, wget serves a local store, and curl/aria2c fail so
    # nothing touches the network. Five samples, one corrupt: the corrupt one
    # must be re-downloaded once and then fail, the rest must reach both
    # mosdepth trees with timing rows and cleaned-up CRAMs, and a resweep must
    # heal the failure and then become a no-op.
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run the hermetic manager test
        working-directory: example/1000G_highcov
        run: bash test_download_manager.sh "${RUNNER_TEMP}/dlmgr_test"
